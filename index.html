<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0e0f16" />
<title>다봄 — 애니·웹툰 아카이브</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>" />
<style>
  :root{
    --bg-0:#0e0f16; --bg-1:#151826; --surface:#191d2c; --card:#1d2233; --card-hover:#252b40;
    --line:#2a3044; --line-soft:#232838; --ink:#f0eee6; --ink-dim:#9498ab; --ink-faint:#5c6178;
    --amber:#eab155; --amber-soft:rgba(234,177,85,0.14);
    --teal:#5fd0c0; --teal-soft:rgba(95,208,192,0.14);
    --rose:#e88a8f; --rose-soft:rgba(232,138,143,0.14);
    --green:#7fd08a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --serif: Georgia, "Noto Serif KR", "Nanum Myeongjo", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg-0);}
  body{font-family:var(--sans); color:var(--ink);}

  .db-root{
    background:
      radial-gradient(700px 380px at 8% -10%, rgba(234,177,85,0.08), transparent 60%),
      radial-gradient(600px 420px at 100% 0%, rgba(95,208,192,0.07), transparent 55%),
      var(--bg-0);
    min-height:100vh;
    padding:22px 14px calc(100px + env(safe-area-inset-bottom)) 14px;
  }
  .db-header{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:10px;}
  .db-wordmark{font-family:var(--serif); font-size:25px; font-weight:700; display:flex; align-items:baseline; gap:8px;}
  .db-wordmark small{font-family:var(--mono); font-size:9px; color:var(--ink-faint); font-weight:400; letter-spacing:1.2px; text-transform:uppercase;}
  .db-stats{font-family:var(--mono); font-size:11px; color:var(--ink-dim); display:flex; align-items:center; gap:10px;}
  .db-stats b{color:var(--amber); font-weight:600;}
  .db-syncdot{width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:2px;}
  .db-syncdot.ok{background:var(--green);}
  .db-syncdot.fail{background:var(--rose);}
  .db-syncdot.pending{background:var(--ink-faint); animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .db-syncbanner{font-size:11px; color:var(--rose); background:var(--rose-soft); border:1px solid rgba(232,138,143,0.35);
    padding:8px 12px; border-radius:8px; margin-bottom:14px; display:none;}
  .db-syncbanner.show{display:block;}

  .db-tabbar{display:flex; gap:3px; padding:4px; background:var(--surface); border:1px solid var(--line);
    border-radius:11px; margin-bottom:14px; width:100%;}
  .db-tabbtn{font-family:var(--sans); font-size:12px; font-weight:600; padding:8px 10px; border-radius:8px;
    border:none; cursor:pointer; background:transparent; color:var(--ink-faint); display:flex; align-items:center;
    gap:5px; white-space:nowrap; flex:1; justify-content:center;}
  .db-tabbtn.active{background:var(--card); color:var(--ink);}
  .db-tabbtn .n{font-family:var(--mono); font-size:10px; opacity:.7;}
  .db-tabbtn.active.tab-towatch{color:var(--amber);}
  .db-tabbtn.active.tab-watched{color:var(--teal);}
  .db-tabbtn.active.tab-dropped{color:var(--rose);}

  .db-toolbar{display:flex; gap:7px; margin-bottom:10px; flex-wrap:wrap;}
  .db-input, .db-select{background:var(--surface); border:1px solid var(--line); color:var(--ink);
    font-family:var(--sans); font-size:12.5px; padding:8px 10px; border-radius:8px; outline:none;}
  .db-input{flex:1; min-width:120px;}
  .db-input:focus, .db-select:focus{border-color:var(--amber);}
  .db-select{cursor:pointer;}

  .db-tagfilter{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:16px; max-height:0; overflow:hidden; transition:max-height .2s;}
  .db-tagfilter.open{max-height:400px;}
  .db-tagtoggle{font-family:var(--mono); font-size:10.5px; color:var(--ink-dim); background:none; border:1px dashed var(--line);
    padding:5px 10px; border-radius:999px; cursor:pointer; margin-bottom:10px;}
  .db-tagchip{font-family:var(--mono); font-size:10px; padding:5px 9px; border-radius:999px; background:var(--surface);
    border:1px solid var(--line); color:var(--ink-dim); cursor:pointer;}
  .db-tagchip.on{background:var(--amber-soft); border-color:var(--amber); color:var(--amber);}
  .db-tagchip.clear{color:var(--ink-faint);}

  .db-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:9px;}
  @media (min-width:640px){ .db-grid{ grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:14px; } }

  .db-card{background:var(--card); border:1px solid var(--line); border-radius:11px; overflow:hidden;
    cursor:pointer; transition:transform .13s, box-shadow .13s; display:flex; flex-direction:column;}
  .db-card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(0,0,0,0.35);}

  .db-thumb{aspect-ratio:2/3; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; background:var(--surface);}
  .db-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .db-thumb .glow{position:absolute; inset:-30%; background:radial-gradient(circle at 30% 20%, rgba(255,255,255,0.16), transparent 55%);}
  .db-thumb .icon{font-size:26px; filter:drop-shadow(0 3px 6px rgba(0,0,0,0.35)); z-index:1;}
  .db-thumb .kindtag{position:absolute; bottom:5px; left:5px; font-family:var(--mono); font-size:7.5px;
    padding:2px 5px; border-radius:4px; background:rgba(10,11,16,0.55); color:rgba(255,255,255,0.85); z-index:2;}
  .db-fav{position:absolute; top:5px; right:5px; width:21px; height:21px; border-radius:50%;
    background:rgba(10,11,16,0.5); border:none; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:11px; color:rgba(255,255,255,0.5); z-index:3;}
  .db-fav.on{color:var(--amber); background:rgba(10,11,16,0.75);}

  .db-info{padding:7px 8px 9px; display:flex; flex-direction:column; gap:4px; flex:1; border-top:1px solid var(--line-soft);}
  .db-name{font-size:11px; font-weight:600; line-height:1.3; color:var(--ink);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .db-tagrow{display:flex; gap:3px; flex-wrap:wrap;}
  .db-mtag{font-family:var(--mono); font-size:8px; padding:1.5px 5px; border-radius:4px;
    background:var(--surface); color:var(--ink-dim); border:1px solid var(--line);}
  .db-note{font-size:9px; color:var(--ink-faint); font-style:italic; line-height:1.25;}
  .db-stars{font-size:9.5px; color:var(--amber); font-family:var(--mono);}
  .db-cscore{font-size:8.5px; color:var(--ink-faint); font-family:var(--mono);}
  .db-reason{font-size:9px; color:var(--rose);}

  .db-empty{grid-column:1/-1; text-align:center; padding:60px 16px; color:var(--ink-faint); font-family:var(--serif); font-size:14px;}

  .db-fab{position:fixed; bottom:calc(20px + env(safe-area-inset-bottom)); right:18px; background:var(--amber); color:#211705; border:none;
    border-radius:999px; padding:12px 18px; font-family:var(--sans); font-weight:700; font-size:12.5px;
    cursor:pointer; box-shadow:0 8px 22px rgba(0,0,0,0.45); z-index:50;}
  .db-fab:hover{filter:brightness(1.07);}

  .db-overlay{position:fixed; inset:0; background:rgba(6,7,11,0.75); display:flex; align-items:center;
    justify-content:center; z-index:100; padding:14px;}
  .db-modal{background:var(--bg-1); border:1px solid var(--line); border-radius:16px; width:100%; max-width:440px;
    max-height:90vh; overflow-y:auto; padding:20px; position:relative;}
  .db-modal h3{font-family:var(--serif); font-size:18px; margin:0 0 4px; padding-right:26px;}
  .db-modal .close{position:absolute; top:16px; right:16px; background:none; border:none; color:var(--ink-faint); font-size:18px; cursor:pointer;}
  .db-field{margin-top:14px;}
  .db-field label{display:block; font-size:10px; color:var(--ink-faint); font-family:var(--mono); margin-bottom:6px; letter-spacing:.5px; text-transform:uppercase;}
  .db-field input[type=text], .db-field textarea{width:100%; background:var(--surface); border:1px solid var(--line);
    color:var(--ink); font-family:var(--sans); font-size:13px; padding:9px 11px; border-radius:8px; outline:none;}
  .db-field textarea{resize:vertical; min-height:52px;}
  .db-field input:focus, .db-field textarea:focus{border-color:var(--amber);}

  .db-chiprow{display:flex; gap:6px; flex-wrap:wrap;}
  .db-pill{font-size:11px; padding:6px 10px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-dim); cursor:pointer;}
  .db-pill.sel{background:var(--teal-soft); border-color:var(--teal); color:var(--teal);}
  .db-pill.sel.reason{background:var(--rose-soft); border-color:var(--rose); color:var(--rose);}
  .db-pill.sel.ott{background:var(--amber-soft); border-color:var(--amber); color:var(--amber);}

  .db-typerow{display:flex; gap:8px;}
  .db-typerow button{flex:1; padding:9px; border-radius:8px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink-dim); font-size:12px; cursor:pointer;}
  .db-typerow button.sel{border-color:var(--amber); color:var(--amber); background:var(--amber-soft);}

  .db-starrow{display:flex; align-items:center; gap:10px;}
  .db-starrow input[type=range]{flex:1; accent-color:var(--amber);}
  .db-starrow .val{font-family:var(--mono); font-size:13px; color:var(--amber); min-width:32px;}

  .db-actions{display:flex; gap:8px; margin-top:18px;}
  .db-btn{flex:1; padding:11px; border-radius:9px; border:none; cursor:pointer; font-family:var(--sans); font-size:12.5px; font-weight:600;}
  .db-btn.primary{background:var(--amber); color:#211705;}
  .db-btn.teal{background:var(--teal); color:#062420;}
  .db-btn.ghost{background:var(--surface); color:var(--ink-dim); border:1px solid var(--line);}
  .db-btn.danger{background:var(--rose-soft); color:var(--rose); border:1px solid rgba(232,138,143,0.4);}
  .db-btn:hover{filter:brightness(1.08);}

  .db-searchresults{display:flex; flex-direction:column; gap:6px; max-height:280px; overflow-y:auto; margin-top:8px;}
  .db-sr-item{display:flex; gap:10px; padding:7px; border:1px solid var(--line); border-radius:9px; cursor:pointer; background:var(--surface); align-items:center;}
  .db-sr-item:hover{border-color:var(--amber);}
  .db-sr-item img{width:38px; height:52px; object-fit:cover; border-radius:5px; flex-shrink:0; background:var(--card);}
  .db-sr-item .meta{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .db-sr-item .t{font-size:12px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .db-sr-item .s{font-size:10px; color:var(--ink-faint); font-family:var(--mono);}
  .db-searchstatus{font-size:11px; color:var(--ink-faint); margin-top:6px; font-family:var(--mono);}
  .db-linklike{background:none; border:none; color:var(--teal); font-size:11.5px; cursor:pointer; text-decoration:underline; padding:0; margin-top:8px;}

  .db-loading{display:flex; align-items:center; justify-content:center; padding:70px; color:var(--ink-faint); font-family:var(--serif);}
</style>
</head>
<body>

<div class="db-root">
  <div class="db-header">
    <div class="db-wordmark">다봄 <small>Anime &amp; Webtoon Archive</small></div>
    <div class="db-stats" id="db-stats"></div>
  </div>
  <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
    <button class="db-uploadbtn" id="db-export-btn">📋 내보내기 (추천용)</button>
  </div>
  <div class="db-syncbanner" id="db-syncbanner"></div>

  <div class="db-tabbar" id="db-tabbar"></div>

  <div class="db-toolbar">

    <select class="db-select" id="db-typefilter">

      <option value="anime">애니</option>

    <select class="db-select" id="db-sort"></select>

  <button class="db-tagtoggle" id="db-tagtoggle">🏷 태그로 필터링</button>
  <div class="db-tagfilter" id="db-tagfilter"></div>

  <div class="db-grid" id="db-grid"><div class="db-loading">불러오는 중...</div></div>
</div>

<button class="db-fab" id="db-add-btn">+ 새 작품</button>

    '문호 스트레이독스':'Bungo Stray Dogs','코드기어스 반역의 를르슈 / 부활의 를루슈':'Code Geass',
    '스텐즈게이트':'Steins Gate','도쿄구울':'Tokyo Ghoul','하이큐':'Haikyuu','귀멸의 칼날':'Demon Slayer'
  };
  function containsKorean(s){ return /[\uAC00-\uD7A3]/.test(s); }
  async function translateKoToEn(text){
    try{
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ko|en`);
      const json = await res.json();
      const t = json && json.responseData && json.responseData.translatedText;
      return (t && t.trim()) ? t.trim() : null;
    }catch(e){ return null; }
  }

  let items = [];
  let currentTab = 'towatch';
  let searchQuery = '';
  let typeFilter = 'all';
  let sortMode = 'favorite';
  let activeTagFilters = new Set();
  let tagFilterOpen = false;
  let syncState = 'pending';

  const grid = document.getElementById('db-grid');
  const tabbarEl = document.getElementById('db-tabbar');
  const statsEl = document.getElementById('db-stats');
  const sortEl = document.getElementById('db-sort');
  const searchEl = document.getElementById('db-search');
  const typeEl = document.getElementById('db-typefilter');
  const tagFilterEl = document.getElementById('db-tagfilter');
  const modalRoot = document.getElementById('db-modal-root');
  const syncBanner = document.getElementById('db-syncbanner');

  function uid(){ return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function updateSyncUI(){
    if(syncState==='fail'){
      syncBanner.className = 'db-syncbanner show';
      syncBanner.textContent = '⚠ 서버와 연결이 안 되고 있어요. 인터넷 연결을 확인해주세요. 방금 한 변경사항이 저장 안 됐을 수 있어요.';
    }else{
      syncBanner.className = 'db-syncbanner';
    }
    render();
  }

  async function loadItems(){
    try{
      const { data, error } = await sb.from(TABLE).select('*').eq('id', ROW_ID).maybeSingle();
      if(error) throw error;
      if(data){
        items = data.data;
        syncState = 'ok';
      }else{
        items = JSON.parse(document.getElementById('db-seed').textContent);
        const { error: insErr } = await sb.from(TABLE).insert({ id: ROW_ID, data: items });
        if(insErr) throw insErr;
        syncState = 'ok';
      }
    }catch(e){
      console.error('load failed', e);
      items = JSON.parse(document.getElementById('db-seed').textContent);
      syncState = 'fail';
    }
    updateSyncUI();
  }

  async function persist(){
    syncState = 'pending'; render();
    try{
      const { error } = await sb.from(TABLE).update({ data: items, updated_at: new Date().toISOString() }).eq('id', ROW_ID);
      if(error) throw error;
      syncState = 'ok';
    }catch(e){
      console.error('save failed', e);
      syncState = 'fail';
    }
    updateSyncUI();
  }

  function subscribeRealtime(){
    sb.channel('dabom-sync')
      .on('postgres_changes', { event:'UPDATE', schema:'public', table:TABLE, filter:`id=eq.${ROW_ID}` }, (payload)=>{
        if(payload.new && payload.new.data){
          items = payload.new.data;
          syncState = 'ok';
          render();
        }
      })
      .subscribe();
  }

  function hueForTitle(title){
    let h = 0;
    for(let i=0;i<title.length;i++){ h = (h*31 + title.charCodeAt(i)) % 360; }
    return h;
  }
  function primaryIcon(item){
    if(item.tags && item.tags.length){ for(const t of item.tags){ if(TAG_ICON[t]) return TAG_ICON[t]; } }
    return item.type === 'webtoon' ? '📖' : '🎬';
  }
  function starString(rating){
    if(rating === null || rating === undefined) return '미평가';
    const full = Math.floor(rating);
    const half = rating - full >= 0.5;
    let s = '★'.repeat(full);
    if(half) s += '½';
    s += '☆'.repeat(Math.max(0,5-full-(half?1:0)));
    return s + ' ' + rating.toFixed(1);
  }
  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderTabbar(){
    const c = {
      towatch: items.filter(i=>i.status==='towatch').length,
      watched: items.filter(i=>i.status==='watched').length,
      dropped: items.filter(i=>i.status==='dropped').length,
    };
    tabbarEl.innerHTML = `
      <button class="db-tabbtn tab-towatch ${currentTab==='towatch'?'active':''}" data-tab="towatch">안 본 것 <span class="n">${c.towatch}</span></button>
      <button class="db-tabbtn tab-watched ${currentTab==='watched'?'active':''}" data-tab="watched">다 본 것 <span class="n">${c.watched}</span></button>
      <button class="db-tabbtn tab-dropped ${currentTab==='dropped'?'active':''}" data-tab="dropped">중도하차 <span class="n">${c.dropped}</span></button>
    `;
    tabbarEl.querySelectorAll('.db-tabbtn').forEach(b=>{
      b.onclick = ()=>{ currentTab=b.dataset.tab; updateSortOptions(); render(); };
    });
  }

  function updateSortOptions(){
    let opts;
    if(currentTab==='towatch') opts = [['favorite','즐겨찾기 우선'],['name','이름순'],['recent','최신 추가순']];
    else if(currentTab==='watched') opts = [['rating_desc','평점 높은순'],['rating_asc','평점 낮은순'],['name','이름순'],['recent','최신 추가순']];
    else opts = [['recent','최신순'],['name','이름순']];
    sortEl.innerHTML = opts.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
    if(!opts.find(o=>o[0]===sortMode)) sortMode = opts[0][0];
    sortEl.value = sortMode;
  }

  function renderTagFilter(){
    tagFilterEl.innerHTML = `<span class="db-tagchip clear" id="tf-clear">전체보기</span>` +
      TAG_VOCAB.map(t=>`<span class="db-tagchip ${activeTagFilters.has(t)?'on':''}" data-tag="${t}">${TAG_ICON[t]||''} ${t}</span>`).join('');
    document.getElementById('tf-clear').onclick = ()=>{ activeTagFilters.clear(); render(); };
    tagFilterEl.querySelectorAll('[data-tag]').forEach(el=>{
      el.onclick = ()=>{
        const t = el.dataset.tag;
        if(activeTagFilters.has(t)) activeTagFilters.delete(t); else activeTagFilters.add(t);
        render();
      };
    });
  }

  function getFiltered(){
    let list = items.filter(i=>i.status===currentTab);
    if(typeFilter!=='all') list = list.filter(i=>i.type===typeFilter);
    if(activeTagFilters.size) list = list.filter(i=> (i.tags||[]).some(t=>activeTagFilters.has(t)));
    if(searchQuery.trim()){
      const q = searchQuery.trim().toLowerCase();
      list = list.filter(i=>i.title.toLowerCase().includes(q));
    }
    list = list.slice();
    if(sortMode==='favorite') list.sort((a,b)=>(b.favorite?1:0)-(a.favorite?1:0));
    else if(sortMode==='name') list.sort((a,b)=>a.title.localeCompare(b.title,'ko'));
    else if(sortMode==='recent') list.sort((a,b)=>(b.addedAt||0)-(a.addedAt||0));
    else if(sortMode==='rating_desc') list.sort((a,b)=>(b.rating||0)-(a.rating||0));
    else if(sortMode==='rating_asc') list.sort((a,b)=>(a.rating||0)-(b.rating||0));
    return list;
  }

  function render(){
    renderTabbar();
    renderTagFilter();
    const list = getFiltered();
    const total = items.length;
    const watchedN = items.filter(i=>i.status==='watched').length;
    statsEl.innerHTML = `<span class="db-syncdot ${syncState}" title="${syncState==='ok'?'동기화됨':syncState==='fail'?'연결 실패':'동기화 중'}"></span>전체 <b>${total}</b> · <b>${total?Math.round(watchedN/total*100):0}%</b>`;

    if(list.length===0){
      grid.innerHTML = `<div class="db-empty">표시할 작품이 없어요.</div>`;
      return;
    }
    grid.innerHTML = '';
    list.forEach(item=>{
      const card = document.createElement('div');
      card.className = 'db-card';
      const hue = hueForTitle(item.title);
      const icon = primaryIcon(item);
      const shownTags = (item.tags||[]).slice(0,2);
      const thumbInner = item.cover
        ? `<img src="${escapeHtml(item.cover)}" alt="" loading="lazy" />`
        : `<div class="glow"></div><span class="icon">${icon}</span>`;
      card.innerHTML = `
        <div class="db-thumb" style="${item.cover?'':`background:linear-gradient(150deg, hsl(${hue},50%,26%), hsl(${(hue+50)%360},55%,15%));`}">
          ${thumbInner}
          <span class="kindtag">${item.type==='webtoon'?'웹툰':'애니'}</span>
          <button class="db-fav ${item.favorite?'on':''}" title="즐겨찾기">★</button>
        </div>

  async function searchAniListRaw(q){
    const query = `query ($search: String) { Page(perPage:8){ media(search:$search, type: ANIME, sort: SEARCH_MATCH) { id title{romaji english} coverImage{large medium} format seasonYear genres averageScore } } }`;
    const res = await fetch('https://graphql.anilist.co', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Accept':'application/json'},
      body: JSON.stringify({ query, variables:{ search:q } })
    });
    if(!res.ok) throw new Error('anilist http ' + res.status);
    const json = await res.json();
    return (json.data && json.data.Page && json.data.Page.media) || [];
  }

  // Korean-aware search: tries the raw query first, then falls back to a known
  // title dictionary, then to a live translation, so Korean titles still match.
  async function searchAniList(q){
    let results = await searchAniListRaw(q);
    if(results.length > 0) return results;
    if(!containsKorean(q)) return results;

    if(KO_EN_MAP[q]){
      results = await searchAniListRaw(KO_EN_MAP[q]);
      if(results.length > 0) return results;
    }
    const translated = await translateKoToEn(q);
    if(translated && translated.toLowerCase() !== q.toLowerCase()){
      results = await searchAniListRaw(translated);
    }
    return results;
  }

  // Same as searchAniList, but also returns which query string actually produced
  // the results (original / dictionary / translated) — needed to score how
  // trustworthy a match is before auto-applying it in bulk matching.
  async function searchAniListSmart(q){
    let queryUsed = q;
    let results = await searchAniListRaw(q);
    if(results.length === 0 && containsKorean(q)){
      if(KO_EN_MAP[q]){
        queryUsed = KO_EN_MAP[q];
        results = await searchAniListRaw(queryUsed);
      }
      if(results.length === 0){
        const translated = await translateKoToEn(q);
        if(translated && translated.toLowerCase() !== q.toLowerCase()){
          queryUsed = translated;
          results = await searchAniListRaw(translated);
        }
      }
    }
    return { results, queryUsed };
  }

  // --- title similarity scoring (used only for bulk auto-matching, where no
  // human reviews each pick) ---
  function normalizeForCompare(s){
    return (s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  }
  function levenshtein(a,b){
    const m=a.length, n=b.length;
    if(m===0) return n;
    if(n===0) return m;
    const dp = Array.from({length:m+1}, ()=> new Array(n+1).fill(0));
    for(let i=0;i<=m;i++) dp[i][0]=i;
    for(let j=0;j<=n;j++) dp[0][j]=j;
    for(let i=1;i<=m;i++){
      for(let j=1;j<=n;j++){
        dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
      }
    }
    return dp[m][n];
  }
  function titleSimilarity(a,b){
    const na = normalizeForCompare(a), nb = normalizeForCompare(b);
    if(!na || !nb) return 0;
    if(na===nb) return 1;
    if(na.length>=3 && nb.length>=3 && (na.includes(nb) || nb.includes(na))) return 0.85;
    const dist = levenshtein(na, nb);
    const maxLen = Math.max(na.length, nb.length);
    return 1 - dist/maxLen;
  }
  const MATCH_CONFIDENCE_THRESHOLD = 0.6;
  function mapAniListGenres(genres){
    const out = new Set();
    (genres||[]).forEach(g=>{ if(GENRE_MAP[g]) out.add(GENRE_MAP[g]); });
    return Array.from(out);
  }

          <div class="db-field">
            <div id="bulk-progress" class="db-searchstatus">0 / ${targets.length}</div>
            <div id="bulk-current" class="db-note" style="margin-top:4px;"></div>
          </div>
          <div class="db-actions">
            <button class="db-btn danger" id="bulk-cancel">중단</button>
          </div>
        </div>
      </div>`;
    document.getElementById('bulk-cancel').onclick = ()=>{ cancelled = true; };
    document.getElementById('db-close').onclick = ()=>{ cancelled = true; closeModal(); };

    let matched = 0, noResult = 0, lowConfidence = 0;
    for(let i=0; i<targets.length; i++){
      if(cancelled) break;
      const item = targets[i];
      const progEl = document.getElementById('bulk-progress');
      const curEl = document.getElementById('bulk-current');
      if(progEl) progEl.textContent = `${i+1} / ${targets.length}`;
      if(curEl) curEl.textContent = item.title;
      try{
        const { results, queryUsed } = await searchAniListSmart(item.title);
        if(results && results.length){
          // score each candidate against the query string that actually produced
          // results (original / dictionary / translated) — reject weak matches
          const scored = results.map(r => ({
            r,
            score: Math.max(
              titleSimilarity(queryUsed, r.title.romaji || ''),
              titleSimilarity(queryUsed, r.title.english || '')
            )
          })).filter(x => x.score >= MATCH_CONFIDENCE_THRESHOLD);

          if(scored.length === 0){
            lowConfidence++;
          }else{
            // among confident matches, prefer the oldest release (original series over remakes/sequels/movies)
            const withYear = scored.filter(x => x.r.seasonYear);
            const pick = (withYear.length ? withYear.slice().sort((a,b)=> a.r.seasonYear - b.r.seasonYear)[0] : scored[0]).r;
            item.officialTitle = pick.title.romaji || pick.title.english || '';
            item.cover = (pick.coverImage && (pick.coverImage.large || pick.coverImage.medium)) || null;
            item.communityScore = pick.averageScore ? pick.averageScore/10 : null;
            const mapped = mapAniListGenres(pick.genres);
            const curTags = new Set(item.tags || []);
            mapped.forEach(t=>curTags.add(t));
            item.tags = Array.from(curTags);
            matched++;
          }
        }else{
          noResult++;
        }
      }catch(e){
        noResult++;
      }
      await new Promise(res=>setTimeout(res, 300));
    }

    if(!cancelled || matched > 0){
      await persist();
    }
    const failed = noResult + lowConfidence;
    modalRoot.innerHTML = `
      <div class="db-overlay" id="db-ov">
        <div class="db-modal">
          <button class="close" id="db-close">✕</button>
          <h3>일괄 매칭 ${cancelled?'중단됨':'완료'}</h3>
          <div class="db-searchstatus">✓ 매칭됨: ${matched}개 · 검색 결과 없음: ${noResult}개 · 유사도 낮아 건너뜀: ${lowConfidence}개${cancelled?` · 처리 안 함: ${targets.length - matched - failed}개`:''}</div>
          <div class="db-note" style="margin-top:8px;">제목은 그대로 두었고, 표지·태그·세간평점만 채웠어요. 못 찾은 항목은 카드를 열어 "실제 작품 정보 다시 찾기"로 개별 시도해보세요.</div>
          <div class="db-actions"><button class="db-btn primary" id="bulk-done">확인</button></div>
        </div>
      </div>`;
    document.getElementById('db-close').onclick = closeModal;
    document.getElementById('bulk-done').onclick = closeModal;
    render();
  }
  document.getElementById('db-bulk-btn').onclick = runBulkMatch;

  function buildExportText(){
    const watched = items.filter(i=>i.status==='watched').slice()
      .sort((a,b)=>(b.rating||0)-(a.rating||0));
    const dropped = items.filter(i=>i.status==='dropped');
    const towatchFav = items.filter(i=>i.status==='towatch' && i.favorite);

    const lines = [];
    lines.push('# 다봄 내보내기 — ' + new Date().toLocaleDateString('ko-KR'));
    lines.push('');
    lines.push(`## 다 본 것 (${watched.length}개, 평점 높은순)`);
    watched.forEach(i=>{
      const rating = (i.rating!=null) ? i.rating.toFixed(1) : '미평가';
      const tags = (i.tags||[]).join(',') || '태그없음';
      const type = i.type==='webtoon' ? '웹툰' : '애니';
      const comment = (i.comment||'').replace(/\n/g,' ').trim();
      lines.push(`- [${type}] ${i.title} | 평점 ${rating} | 태그: ${tags}${comment?` | 코멘트: ${comment}`:''}`);
    });
    if(dropped.length){
      lines.push('');
      lines.push(`## 중도하차 (${dropped.length}개)`);
      dropped.forEach(i=>{
        const reasons = (i.reasonTags||[]).join(',') || '사유 미기재';
        const comment = (i.comment||'').replace(/\n/g,' ').trim();
        lines.push(`- ${i.title} | 사유: ${reasons}${comment?` | 코멘트: ${comment}`:''}`);
      });
    }
    if(towatchFav.length){
      lines.push('');
      lines.push(`## 즐겨찾기한 안 본 것 (${towatchFav.length}개, 관심도 참고용)`);
      towatchFav.forEach(i=> lines.push(`- ${i.title}`));
    }
    return lines.join('\n');
  }

  function openExportModal(){
    const text = buildExportText();
    modalRoot.innerHTML = `
      <div class="db-overlay" id="db-ov">
        <div class="db-modal">
          <button class="close" id="db-close">✕</button>
          <h3>내보내기</h3>
          <div class="db-note" style="margin-top:4px;">이 내용을 복사해서 Claude 대화에 붙여넣으면, 취향 참고해서 추천받을 수 있어요.</div>
          <div class="db-field">
            <textarea id="export-text" readonly style="min-height:280px; font-family:var(--mono); font-size:11px; white-space:pre-wrap;">${escapeHtml(text)}</textarea>
          </div>
          <div class="db-actions">
            <button class="db-btn primary" id="export-copy">📋 클립보드에 복사</button>
          </div>
        </div>
      </div>`;
    document.getElementById('db-close').onclick = closeModal;
    document.getElementById('db-ov').onclick = (e)=>{ if(e.target.id==='db-ov') closeModal(); };
    document.getElementById('export-copy').onclick = async ()=>{
      const ta = document.getElementById('export-text');
      let copied = false;
      try{
        await navigator.clipboard.writeText(ta.value);
        copied = true;
      }catch(e){
        ta.removeAttribute('readonly');
        ta.focus();
        ta.select();
        try{ copied = document.execCommand('copy'); }catch(e2){}
        ta.setAttribute('readonly','true');
      }
      const btn = document.getElementById('export-copy');
      btn.textContent = copied ? '✓ 복사됨!' : '복사 실패 — 직접 선택해서 복사해주세요';
      setTimeout(()=>{ btn.textContent = '📋 클립보드에 복사'; }, 2000);
    };
  }
  document.getElementById('db-export-btn').onclick = openExportModal;
  document.getElementById('db-tagtoggle').onclick = ()=>{
    tagFilterOpen = !tagFilterOpen;
    tagFilterEl.classList.toggle('open', tagFilterOpen);
  };
  searchEl.oninput = ()=>{ searchQuery = searchEl.value; render(); };
  typeEl.onchange = ()=>{ typeFilter = typeEl.value; render(); };
  sortEl.onchange = ()=>{ sortMode = sortEl.value; render(); };

  (async function init(){
    await loadItems();
    updateSortOptions();
    render();
    subscribeRealtime();
  })();
})();
</script>
</body>
</html>
